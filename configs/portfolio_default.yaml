# Quantum Hedge — 用户确认的第一版真实组合配置（2026-07-27）
#
# 目标：500只股票经典漏斗 -> 18只股票决赛候选；与3个OKX合约的
# long/short方向变量组成24-qubit QUBO。持仓数量不固定，QAOA只负责
# 资产/方向选择，连续仓位由经典优化器分配。

universe:
  stock_pool_size: 500
  exclude_st: true
  exclude_suspended: true
  min_listing_days: 250
  min_average_turnover_cny: 50000000
  # 本轮由用户直接指定18只决赛候选，不再运行500→18漏斗。
  candidates:
    - {code: "300308", name: 中际旭创}
    - {code: "002475", name: 立讯精密}
    - {code: "300502", name: 新易盛}
    - {code: "603986", name: 兆易创新}
    - {code: "688981", name: 中芯国际}
    - {code: "300750", name: 宁德时代}
    - {code: "601869", name: 长飞光纤}
    - {code: "000725", name: 京东方A}
    - {code: "600487", name: 亨通光电}
    - {code: "000938", name: 紫光股份}
    - {code: "000977", name: 浪潮信息}
    - {code: "603259", name: 药明康德}
    - {code: "300255", name: 常山药业}
    - {code: "300136", name: 信维通信}
    - {code: "601100", name: 恒立液压}
    - {code: "688017", name: 绿的谐波}
    - {code: "002185", name: 华天科技}
    - {code: "002371", name: 北方华创}

data:
  stock_cache_dir: ../bs_cache_1year
  benchmark_code: "510300"
  # XAU当前只到该日，因此本轮共同截止日固定在2026-07-03。
  as_of: "2026-07-03"
  contract_files:
    BTC: data/crypto_daily/BTC_USDT_1d.csv
    CL: data/crypto_daily/CL_USDT_1d.csv
    XAU: data/crypto_daily/XAU_USDT_1d.csv

preselection:
  alpha_finalists: 18
  factors:
    momentum: 0.30
    downside_adjusted_return: 0.30
    low_volatility: 0.20
    liquidity: 0.20
  momentum_windows: [20, 60, 120]
  max_per_sector: 3

hedges:
  source: okx
  instruments:
    - BTC-USDT-SWAP
    - CL-USDT-SWAP
    - XAU-USDT
  directions: [long, short]
  mutually_exclusive_directions: true

selection:
  qubits: 24
  stock_variables: 18
  hedge_direction_variables: 6
  cardinality: variable
  # 不是目标数量，只是结果有效性护栏。0只股票表示无Alpha信号日；
  # 同一合约的long/short由QUBO互斥惩罚保证不会同时出现。
  min_stocks: 0
  max_stocks: 18
  min_hedge_contracts: 0
  max_hedge_contracts: 3
  stock_holding_cost: 0.01
  hedge_direction_holding_cost: 0.01
  direction_conflict_penalty: 2.0
  # 只是Hamiltonian中的选择尺度，并非最终仓位，也不是固定持仓数量。
  stock_proxy_exposure: 0.05
  hedge_proxy_exposure: 0.08

objective:
  return_model: price_multifactor
  expected_return_weight: 1.0
  downside_risk_weight: 2.0
  downside_model: benchmark_down_conditional_covariance
  benchmark: CSI300
  preferred_window: 120
  # CL历史暂不足完整120个A股交易日；第一版允许共同样本>=60，
  # 报告中必须记录每次实际使用的样本数。
  min_common_observations: 60
  covariance_shrinkage: ledoit_wolf
  beta_target: 0.60
  beta_penalty_weight: 1.0
  turnover_penalty_weight: 0.10
  annualization: 252
  signal_annual_return_scale: 0.15
  min_benchmark_down_observations: 20

qaoa:
  layers: 1
  dtype: complex64
  adjoint: true
  checkpoint: true
  top_k: 4096
  require_direction_feasible: true
  fallback_solver: simulated_annealing
  sa_budget_seconds: 5.0
  seed: 42

allocation:
  method: continuous_convex
  long_short: true
  target_beta: 0.60
  max_stock_weight: 0.08
  max_contract_abs_weight: 0.12
  max_sector_weight: 0.20
  max_gross_exposure: 1.30
  min_net_exposure: 0.40
  max_net_exposure: 1.00
  min_selected_weight: 0.005

rebalance:
  frequency: weekly
  signal_at_close: true
  execution_delay_days: 1
  max_turnover_per_rebalance: 0.20

backtest:
  mode: trend_only_simplified
  benchmark_primary: CSI300
  benchmark_secondary: candidate_equal_weight
  # 用户明确要求：当前阶段只验证价格方向，不建模以下现实细节。
  include_commission: false
  include_slippage: false
  include_funding_rate: false
  include_margin: false
  include_liquidation: false
  include_contract_multiplier: false
  include_roll_or_basis: false
  warning: >-
    该回测只表示按收盘价收益序列计算的策略方向收益，不代表OKX合约
    可实现净收益，也不能用于评估资金占用、爆仓或实盘执行风险。
